name: Monitor Mithibai College Website

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

jobs:
  check-websites:
    runs-on: ubuntu-latest

    steps:
      - name: Download Mithibai Homepage
        run: |
          curl -L -s https://www.mithibai.ac.in/ -o homepage.html

      - name: Download Junior College Notices
        run: |
          curl -L -s https://www.mithibai.ac.in/notices/junior-notices/ -o junior-notices.html

      - name: Check files
        run: |
          echo "Homepage size:"
          wc -c homepage.html
          echo "Junior Notices size:"
          wc -c junior-notices.html

      - name: Send test email
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_APP_PASSWORD }}
          subject: "Mithibai Website Tracker - Test Alert"
          to: ${{ secrets.EMAIL_USERNAME }}
          from: ${{ secrets.EMAIL_USERNAME }}
          body: |
            This is a test email from your Mithibai College website tracker.

            GitHub has successfully accessed:

            1. Mithibai College Homepage
            2. Mithibai Junior College Notices

            Your email notification system is working.
